:root{--bg:#030a1f;--text:#e8eefc;--muted:#8b97b3;--hl:#ffb547}

*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;text-align:center}

b{display:block;font:800 clamp(72px,18vw,128px)/1 system-ui,sans-serif;color:var(--hl);letter-spacing:-.04em}
h1{font-size:24px;margin:12px 0 8px}
p{color:var(--muted);max-width:420px;margin:0 auto 26px}
a{display:inline-block;padding:13px 22px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;text-decoration:none}
small{display:block;margin-top:22px;color:var(--muted);font-size:13px}
small a{padding:0;background:none;color:inherit;text-decoration:underline;font-weight:400}
</style>
</head>
